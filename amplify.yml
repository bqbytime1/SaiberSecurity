# AWS Amplify Hosting build specification.
#
# Without this file Amplify uses its default Next.js build, which installs, builds and
# deploys — but never applies database migrations. The app then serves every page
# correctly and fails the moment anything touches the database, because the tables were
# never created. Creating an account is usually the first thing to hit that, so the
# symptom is a working site with a 500 on sign-up.
#
# Requires two environment variables, set under App settings -> Environment variables:
#
#   DATABASE_URL     PostgreSQL connection string, reachable from AWS.
#                    Amplify does not provide a database. Neon, Supabase or RDS with
#                    public access all work; RDS inside a VPC does not, unless the
#                    compute role is attached to that VPC.
#   SESSION_SECRET   At least 32 characters. Generate with:
#                      node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
#
# Both are needed at build time and at runtime. If DATABASE_URL is missing the build
# fails here, loudly, instead of deploying a site that 500s on first use.

version: 1
frontend:
  phases:
    preBuild:
      commands:
        # --include=dev because Amplify sets NODE_ENV=production, and npm then skips
        # devDependencies — which would drop TypeScript, Tailwind and the Prisma CLI,
        # all of which the build needs.
        - npm ci --include=dev

    build:
      commands:
        # These markers exist so the build log proves which build specification ran.
        # Amplify ignores this file whenever build settings have been saved in its
        # console, and a deploy that silently skipped the migration step is otherwise
        # indistinguishable from one that ran it.
        # No colon-space anywhere in these commands. YAML reads ": " inside an unquoted
        # value as a key separator, so a JavaScript ternary written `a ? b : c` breaks
        # the whole file with a parse error before the build starts.
        - echo "=== SAiberSecurity build spec from repository amplify.yml ==="
        - node -e "console.log('DATABASE_URL present', Boolean(process.env.DATABASE_URL))"
        - node -e "console.log('SESSION_SECRET length', (process.env.SESSION_SECRET || '').length)"

        # Applies any migration the database has not seen yet and does nothing
        # otherwise, so it is safe on every deploy. It never resets or drops anything.
        - echo "=== applying database migrations ==="
        - npx prisma migrate deploy

        # Amplify does not hand environment variables to the SSR runtime.
        #
        # They exist during this build — which is why the migration above succeeds and
        # the build goes green — but the Lambda that serves requests never receives
        # them, so every query fails at runtime with "Environment variable not found:
        # DATABASE_URL" while the deploy looks perfectly healthy.
        #
        # Writing them into .env.production is the documented way across: Next.js loads
        # that file when the server starts, so the values reach the runtime. Only the
        # names below are copied, never the whole environment, so nothing incidental
        # from the build image ends up in the bundle. This file is server-side only —
        # Next.js exposes a variable to the browser solely when it is named
        # NEXT_PUBLIC_*, and none of these are.
        - echo "=== copying environment into the runtime bundle ==="
        - rm -f .env.production
        - touch .env.production
        - env | grep -E "^(DATABASE_URL|SESSION_SECRET|APP_URL|SHOW_DEMO_CREDENTIALS|HOST_MONITOR_ENABLED|MAIL_API_URL|MAIL_API_KEY|MAIL_FROM|MAIL_TRANSPORT|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|MICROSOFT_CLIENT_ID|MICROSOFT_CLIENT_SECRET|MICROSOFT_TENANT|GITHUB_CLIENT_ID|GITHUB_CLIENT_SECRET|TWILIO_ACCOUNT_SID|TWILIO_AUTH_TOKEN|TWILIO_FROM_NUMBER|AI_API_KEY|AI_BASE_URL|AI_MODEL)=" >> .env.production || true

        # Names only, never values — build logs are retained and get shared.
        - node -e "const l=require('fs').readFileSync('.env.production','utf8').split('\n').filter(Boolean); console.log('runtime env entries', l.length); console.log('names', l.map(s=>s.split('=')[0]).join(' '))"

        # Fail here rather than deploy a site that looks fine and 500s on first use.
        - node -e "const t=require('fs').readFileSync('.env.production','utf8'); if(!t.includes('DATABASE_URL=')) { console.error('FATAL DATABASE_URL is not set in this Amplify app, so the runtime cannot reach a database'); process.exit(1) } if(!t.includes('SESSION_SECRET=')) { console.error('FATAL SESSION_SECRET is not set in this Amplify app, so nobody can sign in'); process.exit(1) }"

        # Runs `prisma generate` first (see package.json), which emits the query engine
        # for the runtime platform as well as this build machine — see binaryTargets in
        # prisma/schema.prisma. Without that the Lambda has no engine and every query
        # throws, even though the build succeeded.
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
